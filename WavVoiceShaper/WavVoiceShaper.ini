; WavVoiceShaper setting
; このINIは WavVoiceShaper.exe と同じ階層に配置してください。
; BosaiVoiceDesk 側から呼び出す場合も、通常は exe と同じ階層のこのINIを参照します。
;
; 追加カスタム項目:
; PreGainDb / OutputGainDb = 前段・後段ゲイン(dB)
; RemoveDcOffset = DCずれ補正
; EqLowCutHz / EqHighCutHz = 簡易3バンドEQの境界周波数
; NoiseGate = 小さいノイズ成分を抑制
; VoiceChanger = ピッチ・フォルマント・テンポ・リング変調・WORLD(任意)を使ったボイスチェンジャー
; VoiceChangerEngine = Builtin / World / Auto
; WORLDを使う場合は third_party\world\src にWORLDソースを配置してからビルドしてください。配置しない場合はBuiltin処理に自動フォールバックします。

